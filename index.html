const base=[{"id":"Q001","date":"2026-10-09","patient":"P001","animal":"Perra (por confirmar)","breed":"No especificada","weight":"","procedure":"Extirpación de mastocitoma perivulvar","category":"Oncología","urgency":false,"level":"Sin especificar","diagnostico":"Mastocitoma localizado en el pliegue dorsal de la vulva. Exéresis condicionada por la proximidad anatómica de la vulva.","tecnica":"Resección de la masa con margen dorsal. No pudo mantenerse el mismo margen en la porción ventral por la proximidad a la vulva. Pendiente confirmar márgenes y plano profundo.","suturas":"Técnica de cierre, material y calibre pendientes de confirmar.","participacion":"Participé en la intervención; concretar las maniobras realizadas personalmente.","complicaciones":"Limitación anatómica para obtener márgenes quirúrgicos simétricos. No se ha comunicado ninguna otra incidencia.","aprendizaje":"Planificación de márgenes laterales y profundos en oncología. La localización anatómica condiciona las posibilidades de exéresis. Necesidad de histopatología para valorar grado y márgenes.","seguimiento":"Pendiente: informe histopatológico, márgenes e indicación de tratamiento adicional.","image":"assets/boxer.webp","material":"Observado: instrumental exacto no documentado.\n\nMaterial de referencia: regla y rotulador quirúrgico; bisturí; pinzas de disección atraumáticas; tijeras Metzenbaum; separadores; electrocirugía o ligaduras para hemostasia; material para orientar la pieza; frasco con formol; instrumental limpio para el cierre; sutura monofilamento absorbible para el plano subcutáneo y material cutáneo o intradérmico elegido según la tensión.","protocolo":"1. Confirmar el diagnóstico citológico y registrar tamaño, movilidad, ulceración y relación con la vulva.\n2. Planificar una resección en bloque con margen lateral y profundo adaptado al tamaño, grado sospechado y restricciones anatómicas. Como referencia para mastocitomas cutáneos de bajo grado, se han estudiado márgenes laterales de hasta 2 cm y un plano fascial profundo.\n3. Manipular la masa con suavidad, evitar entrar en ella y controlar la hemostasia.\n4. Orientar la pieza para anatomía patológica e identificar el margen ventral reducido.\n5. Cerrar sin tensión, utilizando liberación subcutánea, suturas de avance o un colgajo si fuera necesario.\n6. Decidir ampliación, vigilancia o tratamiento complementario según grado histológico y márgenes.","puntosCriticos":"Proximidad de vulva y uretra; imposibilidad de obtener márgenes simétricos; preservación de la perfusión cutánea; tensión del cierre; orientación correcta de la muestra; interpretación conjunta del grado y de los márgenes histológicos.","fuentes":"Tobias K. Manual of Small Animal Soft Tissue Surgery. 2.ª ed. Wiley; 2017. Capítulos 1-2, pp. 3-24.\nDonnelly L et al. Evaluation of a two-centimeter lateral surgical margin for excision of grade I and II cutaneous mast cell tumors in dogs. JAVMA. 2006. https://pubmed.ncbi.nlm.nih.gov/16426187/\nACVS. Mastocitomas. https://www.acvs.org/es/small-animal/mast-cell-tumors/"},{"id":"Q002","date":"2026-10-09","patient":"P002","animal":"Gato macho","breed":"No especificada","weight":"","procedure":"Orquiectomía escrotal felina","category":"Cirugía electiva","urgency":false,"level":"Sin especificar","diagnostico":"Castración de gato macho.","tecnica":"Incisión separada en cada bolsa escrotal. Exteriorización sucesiva de cada testículo. Utilización de una pinza mosquito para realizar una autoligadura con el propio cordón espermático, seguida de sección y comprobación de hemostasia. Verificar la secuencia exacta con el cirujano.","suturas":"Autoligadura del cordón espermático, sin sutura de ligadura. Cierre cutáneo no confirmado.","participacion":"Realicé la castración bajo supervisión; precisar el grado de autonomía.","complicaciones":"Control de posible hemorragia del cordón espermático. No se notificaron complicaciones.","aprendizaje":"Técnica de autoligadura del cordón espermático y uso de pinza mosquito. La fijación del nudo proporciona hemostasia; no debe confundirse con avulsión simple.","seguimiento":"Sin datos de evolución postoperatoria.","image":"assets/chat-europeen.webp","material":"Observado: bisturí y pinza mosquito curva para formar la autoligadura.\n\nMaterial de referencia: hoja de bisturí n.º 15; una o dos pinzas mosquito curvas; gasas; solución antiséptica apropiada para escroto; material de ligadura absorbible disponible como alternativa si el cordón es grueso o la autoligadura no resulta segura.","protocolo":"1. Colocar al gato y realizar preparación escrotal suave.\n2. Practicar una incisión longitudinal independiente sobre cada testículo.\n3. Exteriorizar el testículo y liberar las inserciones escrotales; mantener la técnica cerrada si no se abre la túnica vaginal.\n4. Pasar una mosquito curva alrededor del cordón, pinzarlo y seccionarlo 1-2 mm distal a la pinza.\n5. Deslizar la vuelta del cordón sobre el extremo seccionado, formar la autoligadura y apretarla firmemente.\n6. Comprobar la hemostasia antes de devolver el muñón.\n7. Repetir en el lado contralateral y dejar habitualmente las incisiones escrotales abiertas.","puntosCriticos":"La autoligadura debe quedar realmente apretada; comprobar cada muñón antes de soltarlo; evitar tracción o avulsión brusca; vigilar hemorragia, edema escrotal, dolor y lamido postoperatorio.","fuentes":"Tobias K. Manual of Small Animal Soft Tissue Surgery. 2.ª ed. Wiley; 2017. Capítulo 28, pp. 231-238."},{"id":"Q003","date":"2026-10-09","patient":"P003","animal":"Perro macho","breed":"No especificada","weight":"","procedure":"Orquiectomía prescrotal canina","category":"Cirugía electiva","urgency":false,"level":"Sin especificar","diagnostico":"Castración de perro macho.","tecnica":"Una incisión prescrotal (localización exacta por confirmar); exteriorización y tratamiento de un testículo seguido del otro a través del mismo abordaje.","suturas":"Pendiente confirmar técnica abierta/cerrada, ligaduras, tipos de hilo y cierre por planos.","participacion":"Realicé la castración bajo supervisión; concretar pasos realizados.","complicaciones":"Principal riesgo técnico: hemorragia de los pedículos testiculares. Sin incidencias documentadas.","aprendizaje":"Diferencias entre abordaje prescrotal canino y abordaje escrotal felino. Revisar técnicas abierta y cerrada.","seguimiento":"Sin datos postoperatorios.","image":"assets/boxer.webp","material":"Observado: no documentado con precisión.\n\nMaterial de referencia: bisturí; pinzas Adson; tijeras Metzenbaum; pinzas hemostáticas; portaagujas; sutura monofilamento absorbible para los pedículos y planos profundos; material de cierre cutáneo o intradérmico. El calibre se selecciona según el tamaño del perro y del cordón.","protocolo":"1. Colocar al perro en decúbito dorsal y preparar ampliamente la región prescrotal.\n2. Realizar una única incisión prescrotal y avanzar el primer testículo hasta ella.\n3. Exteriorizarlo y decidir técnica abierta o cerrada.\n4. Colocar las pinzas y las ligaduras adecuadas sobre el cordón espermático; añadir una ligadura transfixiante si el pedículo lo requiere.\n5. Seccionar, inspeccionar el muñón y devolverlo al canal inguinal.\n6. Exteriorizar el segundo testículo por la misma incisión y repetir el procedimiento.\n7. Cerrar subcutáneo y piel sin incorporar el escroto.","puntosCriticos":"Confirmar que ambos testículos han sido retirados; diferenciar técnica abierta y cerrada; asegurar arteria y vena testiculares y conducto deferente; revisar la hemostasia antes de devolver cada muñón; evitar espacio muerto y tensión cutánea.","fuentes":"Tobias K. Manual of Small Animal Soft Tissue Surgery. 2.ª ed. Wiley; 2017. Capítulo 29, pp. 239-248."},{"id":"Q004","date":"2026-10-09","patient":"P004","animal":"Gata","breed":"No especificada","weight":"","procedure":"Ovariectomía felina","category":"Cirugía electiva","urgency":false,"level":"Sin especificar","diagnostico":"Esterilización mediante extirpación de ambos ovarios; confirmar que el útero permaneció in situ.","tecnica":"Ovariectomía bilateral. Pendiente documentar vía de abordaje, técnica de hemostasia y pasos precisos.","suturas":"Pendiente confirmar material, calibre y patrón de sutura.","participacion":"Intervine en la ovariectomía bajo supervisión; detallar maniobras.","complicaciones":"Control de hemorragia de pedículos ováricos. Sin incidencias conocidas.","aprendizaje":"Anatomía: pedículo ovárico, ligamento suspensorio, ligamento propio, cuernos uterinos y ligamento ancho.","seguimiento":"No documentado.","image":"assets/chat-europeen.webp","material":"Observado: vía de abordaje, sistema de hemostasia y suturas pendientes de confirmar.\n\nMaterial de referencia para ovariectomía abierta: equipo de laparotomía pequeño; gancho de ovario si está indicado; pinzas hemostáticas; pinzas atraumáticas; tijeras; portaagujas; sutura absorbible para pedículos y pared abdominal. Alternativa laparoscópica: torre, óptica, trocares, insuflador y dispositivo de sellado vascular.","protocolo":"1. Preparar ampliamente el abdomen y acceder por línea media o por el abordaje elegido.\n2. Identificar un cuerno uterino y seguirlo hasta el ovario.\n3. Exponer el pedículo sin traccionar los vasos; distender o seccionar con control el ligamento suspensorio.\n4. Crear una ventana segura en el ligamento ancho y ligar o sellar el pedículo ovárico.\n5. Seccionar el ligamento propio inmediatamente caudal al ovario, preservando el útero.\n6. Verificar que el ovario se ha retirado por completo y que no existe hemorragia.\n7. Repetir en el lado contralateral y cerrar la pared abdominal por planos.","puntosCriticos":"Hemorragia del pedículo; desgarro vascular por tracción; identificación completa de ambos ovarios; lesión de bazo, intestino o vasos con el gancho; remanente ovárico; elección de ovariectomía frente a ovariohisterectomía según paciente e indicación.","fuentes":"Tobias K. Manual of Small Animal Soft Tissue Surgery. 2.ª ed. Wiley; 2017. Capítulo 33, pp. 265-282.\nPievaroli AM et al. Laparoscopy and Thoracoscopy in the Dog and Cat. Edra; 2023. Capítulo 15."},{"id":"Q005","date":"2026-10-09","patient":"P005","animal":"Perro macho","breed":"Pastor belga malinois (perro policía)","weight":"","procedure":"Extirpación de nódulo en flanco derecho","category":"Oncología","urgency":false,"level":"Sin especificar","diagnostico":"Nódulo localizado en el flanco derecho. Naturaleza histológica no confirmada.","tecnica":"Extirpación quirúrgica de un nódulo en el flanco derecho. Pendiente documentar tamaño, planos y márgenes.","suturas":"No documentado.","participacion":"Participé en el procedimiento; grado de ejecución pendiente.","complicaciones":"No documentadas.","aprendizaje":"Evaluar márgenes y orientación de muestras de masas cutáneas/subcutáneas.","seguimiento":"Pendiente de anatomía patológica, si se remitió muestra.","image":"assets/malinois.webp","material":"Observado: instrumental y método de cierre no documentados.\n\nMaterial de referencia: regla y rotulador; bisturí; pinzas y tijeras de disección; electrocirugía o ligaduras; material para marcar orientación; frasco con formol; pinzas de campo para comprobar aposición; sutura absorbible para subcutáneo y material cutáneo según localización y tensión.","protocolo":"1. Medir, fotografiar y describir el nódulo antes de preparar el campo.\n2. Definir el objetivo: biopsia excisional o resección oncológica con márgenes planificados.\n3. Marcar una elipse orientada con las líneas de tensión cutánea.\n4. Resecar la lesión en bloque sin penetrarla y controlar vasos durante la disección.\n5. Orientar la muestra y solicitar evaluación histológica de tipo tumoral y márgenes.\n6. Reducir espacio muerto y tensión con disección subcutánea prudente, suturas de avance o técnicas reconstructivas si fueran necesarias.\n7. Registrar el resultado histopatológico y el plan posterior.","puntosCriticos":"No confundir una extracción marginal con una resección oncológica amplia; conservar orientación de la muestra; evitar ruptura tumoral; proteger vasos cutáneos directos; anticipar tensión y espacio muerto del flanco.","fuentes":"Tobias K. Manual of Small Animal Soft Tissue Surgery. 2.ª ed. Wiley; 2017. Capítulos 1-2, pp. 3-24."},{"id":"Q006","date":"2026-10-09","patient":"P005","animal":"Perro macho","breed":"Pastor belga malinois (mismo paciente que Q005)","weight":"","procedure":"Biopsia incisional de lesión en tarso izquierdo","category":"Oncología","urgency":false,"level":"Sin especificar","diagnostico":"Lesión en tarso izquierdo sospechosa de sarcoma; diagnóstico no confirmado.","tecnica":"Biopsia incisional, con obtención de parte de la lesión en lugar de extirparla completamente. Confirmar instrumental y plano muestreado.","suturas":"No documentado.","participacion":"Participé en el procedimiento; precisar gestos.","complicaciones":"Planificar el trayecto de biopsia para que pueda incluirse en una futura exéresis cuando sea posible.","aprendizaje":"Diferencia entre biopsia incisional y exéresis; importancia de planificar la biopsia en oncología.","seguimiento":"Pendiente de histopatología. Realizada en el mismo perro que Q005.","image":"assets/malinois.webp","material":"Observado: técnica exacta, bisturí o punch, pendiente de confirmar.\n\nMaterial de referencia: bisturí con hoja pequeña o punch del diámetro elegido; pinzas Adson-Brown; tijeras Metzenbaum; electrocirugía cuidadosa; sutura monofilamento; frasco con formol; rotulador y fotografía para documentar el trayecto.","protocolo":"1. Revisar imagen y planificar la futura resección antes de elegir el punto de biopsia.\n2. Situar el trayecto en el eje de la futura incisión, en una zona representativa y viable, evitando necrosis, ulceración y estructuras neurovasculares.\n3. Obtener una muestra suficientemente profunda con una incisión longitudinal corta, limitando la contaminación a un único compartimento tisular.\n4. Realizar hemostasia y cierre simple, sin crear colgajos ni disección extensa.\n5. Identificar y enviar la muestra a histopatología.\n6. Si se confirma sarcoma, incluir cicatriz y trayecto de biopsia en la resección definitiva siempre que la planificación lo permita.","puntosCriticos":"El trayecto condiciona la cirugía definitiva; evitar planos múltiples y hematoma; obtener tejido viable y representativo; no intentar una exéresis incompleta de una masa grande en el tarso; correlacionar histología, grado e imagen para planificar márgenes.","fuentes":"Tobias K. Manual of Small Animal Soft Tissue Surgery. 2.ª ed. Wiley; 2017. Capítulo 2, pp. 15-24.\nConsensus report on canine cutaneous and subcutaneous soft tissue sarcoma. https://pmc.ncbi.nlm.nih.gov/articles/PMC13192336/"},{"id":"Q007","date":"2026-10-13","patient":"P006","animal":"Perra","breed":"Mestiza de labrador","weight":"24 kg","procedure":"Ovariohisterectomía de urgencia por piometra","category":"Urgencias","urgency":true,"level":"Sin especificar","diagnostico":"Piometra en perra mestiza de labrador de 24 kg. Cirugía durante una guardia nocturna.","tecnica":"Laparotomía ventral por línea media (~10 cm según recuerdo). Disección de tejido adiposo y hemostasia mediante un instrumento de sellado vascular por energía, utilizado dos veces antes de seccionar (modelo por confirmar). Coagulación bipolar adicional de vasos pequeños. Exteriorización cuidadosa de útero y cuernos uterinos. Se abordó primero el ovario izquierdo; localización, tratamiento del pedículo y sección con dispositivo de sellado/corte. Mismo procedimiento en el derecho. Sección del cuerpo uterino tras asegurar el muñón proximal. Nota anatómica: en la perra el ovario DERECHO está normalmente más craneal que el izquierdo; verificar razón de empezar por el izquierdo.","suturas":"Cierre del muñón uterino: técnica/patrón por confirmar. Cierre de línea alba, tejido subcutáneo y piel; en piel se observaron puntos simples separados. Confirmar hilo, calibre, tipo de aguja y patrones de cada plano.","participacion":"Acudí a la guardia y participé en la intervención. Pendiente detallar maniobras realizadas de forma autónoma o asistida.","complicaciones":"Principales riesgos: hemorragia de pedículos ováricos o muñón uterino, rotura del útero distendido, contaminación peritoneal, peritonitis y complicaciones sépticas/anestésicas. Sin complicaciones intraoperatorias concretas comunicadas.","aprendizaje":"Aprendí a reconocer y diferenciar sellado vascular por energía y coagulación bipolar. Repasé la anatomía de ovarios, pedículos, cuernos, cuerpo uterino, cérvix y línea alba. Observé el cierre abdominal por planos.","seguimiento":"Pendiente confirmar estado del útero, eventual líquido libre, evolución postoperatoria, fármacos y recuperación.","image":"assets/labrador.webp","material":"Observado: dispositivo de termofusión vascular con dos activaciones antes de la sección; coagulación bipolar para vasos pequeños.\n\nMaterial de referencia: equipo completo de laparotomía; separador abdominal; pinzas atraumáticas; aspiración; compresas abdominales; dispositivo de sellado o pinzas hemostáticas y sutura absorbible; material de lavado si existe contaminación; guantes e instrumental limpios para el cierre; material para cultivo o histopatología según el caso.","protocolo":"1. Estabilizar a la paciente, evaluar sepsis, perfusión, función renal y alteraciones electrolíticas antes de anestesia.\n2. Preparar ampliamente y realizar una laparotomía media suficientemente larga; no utilizar gancho de ovario sobre un útero frágil y distendido.\n3. Aislar y exteriorizar el útero con compresas, manipulándolo con suavidad para evitar ruptura.\n4. Sellar o ligar ambos pedículos ováricos y comprobar su hemostasia.\n5. Controlar vasos del ligamento ancho según necesidad.\n6. Ligar o sellar el cuerpo uterino próximo al cérvix, seccionar y retirar útero y ovarios sin contaminar el abdomen.\n7. Si hay contaminación, tomar muestras, lavar según criterio y cambiar guantes e instrumental antes del cierre.\n8. Cerrar línea alba, subcutáneo y piel; continuar monitorización intensiva, analgesia y tratamiento médico de la sepsis.","puntosCriticos":"Ruptura del útero; contaminación peritoneal; hemorragia de pedículos o muñón; hipotensión y sepsis; lesión ureteral; fragilidad tisular; necesidad de comprobar todo el abdomen antes de cerrar.","fuentes":"Tobias K. Manual of Small Animal Soft Tissue Surgery. 2.ª ed. Wiley; 2017. Capítulos 33 y 35, pp. 265-282 y 289-294."},{"id":"Q008","date":"2026-10-16","patient":"P007","animal":"Perro","breed":"No especificada","weight":"30,1 kg","procedure":"Osteosíntesis de fractura abierta conminuta de radio y cúbito izquierdos","category":"Traumatología","urgency":true,"level":"Sin especificar","diagnostico":"Brutus, perro de 30,1 kg, atropellado lateralmente por un coche. Fractura abierta de la extremidad anterior izquierda, con radio y cúbito fragmentados en múltiples pequeños fragmentos. Grado de fractura abierta, estado neurovascular y lesiones asociadas pendientes de confirmar.","tecnica":"Se planteó reconstrucción del miembro y amputación si la reconstrucción no era viable. La reconstrucción se realizó mediante doble placa sobre el radio, con una placa en posición craneal y otra medial, formando una construcción ortogonal. Se practicó un bloqueo regional descrito en la nota como bloqueo del plexo braquial justo proximal al codo con bupivacaína. Pendiente confirmar abordajes, reducción, sistema de placas, diámetros y número de tornillos, tratamiento del cúbito, lavado y desbridamiento.","suturas":"Cierre de la herida traumática y de los abordajes quirúrgicos no documentado. Pendiente confirmar planos, material, drenaje y vendaje postoperatorio.","participacion":"Presente durante la intervención. Pendiente especificar si la participación fue observación, asistencia o ejecución de maniobras concretas bajo supervisión.","complicaciones":"Riesgos principales: contaminación e infección de la fractura abierta, lesión neurovascular, pérdida de vascularización de fragmentos, fallo de implantes, retraso de consolidación o no unión, osteomielitis, síndrome compartimental, rigidez y necesidad secundaria de amputación. No se ha documentado ninguna complicación intraoperatoria concreta.","aprendizaje":"Planificación de una fractura abierta altamente conminuta; decisión entre salvamento y amputación; concepto de placa puente y estabilidad ortogonal; importancia de conservar la biología del foco; reconocimiento del bloqueo regional con bupivacaína como parte de la analgesia multimodal.","seguimiento":"Pendiente: grado de fractura abierta, antibioterapia, cultivos, radiografías pre y posoperatorias, apoyo del miembro, controles de herida, retirada o mantenimiento de vendaje y evolución radiográfica de la consolidación.","image":"assets/brutus-chien.webp","material":"Observado: dos placas sobre el radio, una craneal y otra medial; bupivacaína para el bloqueo regional.\n\nMaterial de referencia: equipo de traumatología; aspiración y lavado abundante; instrumental separado para desbridamiento y reconstrucción; pinzas de reducción; elevador perióstico utilizado de forma limitada; placas y tornillos seleccionados tras planificación radiográfica; motor, brocas, guías, medidor de profundidad y destornilladores; intensificador o radiografía perioperatoria si está disponible; material de cultivo profundo; vendaje estéril.","protocolo":"1. Estabilización inicial del paciente politraumatizado y evaluación neurovascular completa del miembro.\n2. Radiografías ortogonales que incluyan articulaciones adyacentes; valorar otras lesiones del atropello.\n3. Proteger la herida, iniciar analgesia y antimicrobianos según el protocolo de fractura abierta; clasificar contaminación y lesión de tejidos blandos.\n4. Lavado y desbridamiento meticulosos, retirando tejido claramente desvitalizado y conservando fragmentos viables con sus inserciones.\n5. Decidir salvamento frente a amputación según viabilidad, contaminación, posibilidad de estabilización y pronóstico funcional.\n6. Restaurar longitud, eje y rotación. En conminución severa, utilizar principios de placa puente y evitar la disección innecesaria del foco.\n7. Aplicar la construcción planificada: en este caso, placas craneal y medial sobre el radio; posición y densidad de tornillos dependen de la geometría y del sistema.\n8. Comprobar alineación e implantes, lavar, cambiar guantes e instrumental si procede y cerrar respetando los tejidos blandos.\n9. Radiografías posoperatorias, analgesia multimodal, vigilancia de herida y perfusión distal, restricción de actividad y controles radiográficos seriados.","puntosCriticos":"Fractura abierta y muy conminuta; preservación vascular de los fragmentos; cobertura de implantes; alineación en los tres planos; longitud y rotación; estabilidad suficiente de los segmentos principales; contaminación; compatibilidad entre tornillos de las dos placas; control neurológico y vascular distal; posibilidad real de amputación si el salvamento fracasa.","fuentes":"AO Surgery Reference. Bridging plate fixation, distal radius and ulna. https://surgeryreference.aofoundation.org/vet/dog/distal-radius-and-ulna/23-a2/bridging-plate\nBSAVA Manual of Canine and Feline Fracture Repair and Management. Capítulo: The radius and ulna. https://www.bsavalibrary.com/content/chapter/10.22233/9781910443279.chap21\nHiguchi et al. Clinical outcomes of orthogonal plating to treat radial and ulnar fractures in toy-breed dogs. J Small Anim Pract. 2021. https://pubmed.ncbi.nlm.nih.gov/34260758/\nFutema et al. A new brachial plexus block technique in dogs. Vet Anaesth Analg. https://pubmed.ncbi.nlm.nih.gov/28404237/"}];
let records=load(), page='dashboard', opened=null, editing=null, search='', cat='Todas';
function load(){
  try{
    const v=JSON.parse(localStorage.getItem(KEY));
    if(!Array.isArray(v)) return structuredClone(base);
    const enrichedKeys=['material','protocolo','puntosCriticos','fuentes','image'];
    const migrated=v.map(r=>{
      const b=base.find(x=>x.id===r.id);
      if(!b) return r;
      const out={...b,...r};
      enrichedKeys.forEach(k=>{
        if(r[k]===undefined || r[k]===null || String(r[k]).trim()==='') out[k]=b[k]||'';
      });
      return out;
    });
    const newest=base.find(x=>x.id==='Q008');
    if(newest && !migrated.some(r=>r.id==='Q008')) migrated.push(structuredClone(newest));
    localStorage.setItem(KEY,JSON.stringify(migrated));
    return migrated;
  }catch{
    return structuredClone(base);
  }
}
function save(){localStorage.setItem(KEY,JSON.stringify(records));toast('Cambios guardados en este navegador')}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function linkify(s){
  const escaped=escapeHtml(s).replace(/\n/g,'<br>');
  return escaped.replace(/https?:\/\/[^\s<]+/g,url=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
}
function nice(d){if(!d)return 'Sin fecha';return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.toastT);window.toastT=setTimeout(()=>t.style.display='none',2600)}
function go(p){page=p;opened=null;editing=null;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}
function header(tag,title,desc,buttons=''){return `<div class="top"><div><div class="eyebrow">${tag}</div><h1>${title}</h1><div class="muted">${desc}</div></div><div class="actions">${buttons}</div></div>`}

  const skin='#f7d8c8', ink='#234d46', coral='#ed865f', mint='#8dc8aa', bone='#f5e7c5', red='#c95f5f', blue='#5a8fa8';

function artwork(r,wide=false){
  const p=(r.procedure||'').toLowerCase();
  let label=p.includes('fractura')?'TRAUMATOLOGÍA · OSTEOSÍNTESIS':p.includes('orquiect')?'CIRUGÍA REPRODUCTIVA':(p.includes('piometr')?'URGENCIA · CIRUGÍA REPRODUCTIVA':(p.includes('ovari')?'CIRUGÍA REPRODUCTIVA':(p.includes('biops')?'ONCOLOGÍA · BIOPSIA':'ONCOLOGÍA · EXÉRESIS')));
  const alt=`Retrato ilustrativo de ${r.animal||'paciente veterinario'}; no corresponde al paciente real`;
  const photo=`<figure class="photo-card"><img src="${escapeHtml(r.image||'assets/labrador.webp')}" alt="${escapeHtml(alt)}" loading="${wide?'eager':'lazy'}"><figcaption>Imagen ilustrativa · no corresponde al paciente</figcaption></figure>`;
  if(!wide) return `<figure class="artwork" aria-label="${escapeHtml(alt)}"><img src="${escapeHtml(r.image||'assets/labrador.webp')}" alt="" loading="lazy"><figcaption class="art-caption">${label}</figcaption></figure>`;
  return `<div class="detail-media">${photo}<figure class="procedure-card">${procedureDiagram(r)}<figcaption>Esquema didáctico original · no a escala</figcaption></figure></div>`;
}
function speciesThumb(name){
  const cat=name==='Gato';
  const src=cat?'assets/chat-europeen.webp':'assets/labrador.webp';
  return `<img class="species-img" src="${src}" alt="" loading="lazy">`;
}
function card(r){return `<div class="case">${artwork(r)}<div class="pills"><span class="pill ${r.urgency?'alert':''}">${escapeHtml(r.category)}</span><span class="pill">${escapeHtml(r.id)}</span></div><div class="case-title">${escapeHtml(r.procedure)}</div><div class="muted small">${nice(r.date)} · ${escapeHtml(r.animal)}<br>${escapeHtml(r.breed)}</div><div class="case-bottom"><span class="muted small">${escapeHtml(r.level)} · ${escapeHtml(r.patient)}</span><button class="btn" onclick="openCase('${escapeHtml(r.id)}')">Ver ficha →</button></div></div>`}
function filtered(){return records.filter(r=>(cat==='Todas'||r.category===cat)&&(`${r.procedure} ${r.breed} ${r.animal} ${r.id} ${r.patient}`.toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)||a.id.localeCompare(b.id))}
function dashboard(){const patients=new Set(records.map(r=>r.patient)).size, emergency=records.filter(r=>r.urgency).length;document.getElementById('main').innerHTML=header('Mi trayectoria quirúrgica','Un quirófano. Cada día, un aprendizaje.','Registro personal de cirugía de tejidos blandos, oncología y traumatología.',`<button class="btn primary" onclick="newCase()">＋ Nueva intervención</button>`)+`<div class="welcome-strip"><span class="welcome-dot">✦</span><span><strong>Cada intervención cuenta.</strong> Un cuaderno para seguir tus gestos, tus aprendizajes y tu progreso en quirófano.</span></div><div class="stats"><div class="stat"><strong>${records.length}</strong><label>Actos quirúrgicos</label></div><div class="stat"><strong>${patients}</strong><label>Pacientes distintos</label></div><div class="stat"><strong>${new Set(records.map(r=>r.date)).size}</strong><label>Jornadas de cirugía</label></div><div class="stat"><strong>${emergency}</strong><label>Urgencias</label></div></div><div class="notice">Tu cuaderno distingue entre <b>observado, asistido y realizado bajo supervisión</b>. Los datos no confirmados permanecen explícitamente señalados. La información se guarda en este navegador; exporta copias de seguridad periódicamente.</div><div class="section"><div class="section-head"><h2>Últimas intervenciones</h2><button class="btn" onclick="go('registro')">Ver todo el registro →</button></div><div class="cases">${[...records].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,6).map(card).join('')}</div></div><div class="footer">Uso formativo personal. No introducir nombres de propietarios, números de historia clínica ni datos que identifiquen a los pacientes o a sus responsables.</div>`}
function registro(){document.getElementById('main').innerHTML=header('Registro operatorio','Todas mis intervenciones','Fichas detalladas, búsqueda y clasificación.',`<button class="btn primary" onclick="newCase()">＋ Nueva intervención</button>`)+`<div class="section"><div class="filters"><input id="search" class="field search" placeholder="Buscar técnica, paciente, especie..." value="${escapeHtml(search)}" oninput="search=this.value;updateCards()"><select class="filter-select" onchange="cat=this.value;updateCards()"><option>Todas</option>${['Oncología','Cirugía electiva','Urgencias','Traumatología','Tejidos blandos','Otros'].map(x=>`<option ${cat===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="section"><div class="cases" id="cards"></div></div>`;updateCards()}
function updateCards(){let e=document.getElementById('cards');if(e)e.innerHTML=filtered().length?filtered().map(card).join(''):'<div class="empty">No hay intervenciones con estos filtros.</div>'}
function openCase(id){opened=id;editing=null;page='detail';render();window.scrollTo(0,0)}
function detail(){
  let r=records.find(x=>x.id===opened);
  if(!r){go('registro');return}
  let linked=records.filter(x=>x.patient===r.patient&&x.id!==r.id);
  document.getElementById('main').innerHTML=`<button class="btn" onclick="go('registro')">← Volver al registro</button><div class="section">${header(r.id+' · '+nice(r.date),escapeHtml(r.procedure),escapeHtml(r.category),`<button class="btn primary" onclick="editCase('${r.id}')">✎ Editar ficha</button>`)}</div>${artwork(r,true)}<div class="notice evidence-note"><b>Lectura de la ficha:</b> «Observado» recoge lo documentado durante el caso. «Referencia» resume un protocolo formativo basado en las fuentes citadas; no sustituye la decisión del cirujano responsable.</div><div class="panel"><div class="detail-grid">${[['Paciente',r.patient],['Especie',r.animal],['Raza',r.breed],['Peso',r.weight||'No registrado'],['Fecha',nice(r.date)],['Mi nivel',r.level]].map(([k,v])=>`<div><div class="kv">${k}</div><div class="vv">${escapeHtml(v)}</div></div>`).join('')}</div>${linked.length?`<div class="notice" style="margin-top:17px"><b>Mismo paciente:</b> ${linked.map(x=>`<a href="#" onclick="event.preventDefault();openCase('${x.id}')">${escapeHtml(x.id)} · ${escapeHtml(x.procedure)}</a>`).join(' · ')}</div>`:''}</div><div class="blocks">${fields.map(([k,l])=>`<div class="block ${['material','protocolo','puntosCriticos','fuentes'].includes(k)?'reference':''} ${k==='fuentes'?'sources':''}"><h3>${escapeHtml(l)}</h3><p>${k==='fuentes'?linkify(r[k]||'Pendiente de completar.'):escapeHtml(r[k]||'Pendiente de completar.')}</p></div>`).join('')}</div><div class="section actions"><button class="btn primary" onclick="editCase('${r.id}')">✎ Editar esta ficha</button><button class="btn" onclick="duplicateCase('${r.id}')">Duplicar como nueva</button><button class="btn danger" onclick="deleteCase('${r.id}')">Eliminar</button></div>`;
}
function newCase(){editing='new';page='edit';render();window.scrollTo(0,0)}function editCase(id){editing=id;page='edit';render();window.scrollTo(0,0)}
function editView(){const isNew=editing==='new';let r=isNew?{id:'Q'+String(Math.max(0,...records.map(x=>Number(x.id.replace(/\D/g,''))||0))+1).padStart(3,'0'),date:new Date().toISOString().slice(0,10),patient:'P'+String(new Set(records.map(x=>x.patient)).size+1).padStart(3,'0'),animal:'',breed:'',weight:'',procedure:'',category:'Tejidos blandos',urgency:false,level:'Sin especificar'}:records.find(x=>x.id===editing);if(!r){go('registro');return}document.getElementById('main').innerHTML=`<button class="btn" onclick="${isNew?"go('registro')":`openCase('${r.id}')`}">← Cancelar</button><div class="section">${header('Formulario operatorio',isNew?'Nueva intervención':'Editar '+r.id,'La ficha reúne observación, material, protocolo, puntos críticos y fuentes.')}</div><form id="caseForm" class="panel" onsubmit="submitCase(event)"><div class="edit-grid">${[['date','Fecha','date'],['patient','Identificador anónimo de paciente','text'],['animal','Especie / sexo','text'],['breed','Raza','text'],['weight','Peso','text'],['procedure','Procedimiento quirúrgico','text']].map(([k,l,t])=>`<div><label for="${k}">${l}</label><input class="field" id="${k}" name="${k}" type="${t}" ${k==='procedure'?'required':''} value="${escapeHtml(r[k]||'')}"></div>`).join('')}<div><label>Técnica para estadísticas (atlas)</label><select name="technique"><option value="">Seleccionar / asignación automática</option>${[...new Set(Object.values(CATALOG).flatMap(g=>Object.values(g).flat()))].sort().map(x=>`<option value="${escapeHtml(x)}" ${(r.technique||initialTech[r.id])===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select></div><div><label>Categoría</label><select name="category">${['Oncología','Cirugía electiva','Urgencias','Traumatología','Tejidos blandos','Otros'].map(x=>`<option ${r.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Mi nivel de participación</label><select name="level">${['Sin especificar','Observación','Asistencia','Realización parcial supervisada','Realización principal supervisada'].map(x=>`<option ${r.level===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="full"><label><input type="checkbox" name="urgency" ${r.urgency?'checked':''}> &nbsp; Cirugía de urgencia</label></div>${fields.map(([k,l])=>`<div class="full"><label>${l}</label><textarea name="${k}" rows="5" placeholder="Describe los pasos, técnicas y observaciones...">${escapeHtml(r[k]||'')}</textarea></div>`).join('')}</div><div class="actions" style="margin-top:20px"><button class="btn primary" type="submit">✓ Guardar intervención</button><button class="btn" type="button" onclick="go('registro')">Cancelar</button></div></form>`;window.draft=r}
function submitCase(e){e.preventDefault();const f=new FormData(e.target),r={...window.draft};for(const [k,v] of f.entries())r[k]=String(v);r.urgency=e.target.elements.urgency.checked;if(!r.procedure.trim())return;if(editing==='new')records.push(r);else records=records.map(x=>x.id===editing?r:x);save();openCase(r.id)}
function duplicateCase(id){let r=records.find(x=>x.id===id);if(!r)return;const n={...r,id:'Q'+String(Math.max(0,...records.map(x=>Number(x.id.replace(/\D/g,''))||0))+1).padStart(3,'0'),date:new Date().toISOString().slice(0,10)};records.push(n);save();editCase(n.id)}
function deleteCase(id){if(!confirm('¿Eliminar definitivamente esta intervención del navegador? Exporta una copia antes si quieres conservarla.'))return;records=records.filter(x=>x.id!==id);save();go('registro')}
function atlas(){
const opts=Object.keys(CATALOG),group=CATALOG[atlasSpecies],mine=records.filter(r=>species(r)===atlasSpecies);let all=Object.entries(group).flatMap(([g,ts])=>ts.map(t=>({g,t,items:mine.filter(r=>tech(r)===t)})));let practiced=all.filter(x=>x.items.length).length;
document.getElementById('main').innerHTML=header('Mapa de competencias','Atlas de cirugías','Catálogo orientativo y ampliable de intervenciones caninas y felinas. Las cifras se calculan a partir del registro operatorio.',`<button class="btn primary" onclick="newCase()">＋ Añadir cirugía</button>`)+`<div class="section actions">${opts.map(x=>`<button class="btn ${x===atlasSpecies?'primary':''}" onclick="atlasSpecies='${x}';atlas()">${speciesThumb(x)} ${x}</button>`).join('')}</div><div class="stats"><div class="stat"><strong>${mine.length}</strong><label>Actos registrados</label></div><div class="stat"><strong>${practiced}</strong><label>Técnicas distintas</label></div><div class="stat"><strong>${all.length}</strong><label>Técnicas del catálogo</label></div><div class="stat"><strong>${mine.filter(r=>r.level.includes('Realización')).length}</strong><label>Actos ejecutados bajo supervisión</label></div></div><div class="notice">La frecuencia refleja experiencia registrada, no competencia clínica acreditada. El nivel de participación se asigna por intervención, no automáticamente por técnica. Se cuentan ambos actos del mismo paciente cuando son procedimientos diferentes.</div>`+Object.entries(group).map(([grp,arr])=>`<div class="section panel"><h2>${grp}</h2><div class="atlas-grid">${arr.map(t=>{let a=mine.filter(r=>tech(r)===t),n=a.length;let levels=a.map(r=>r.level),best=levels.includes('Realización principal supervisada')?'Realización principal supervisada':levels.includes('Realización parcial supervisada')?'Realización parcial supervisada':levels.includes('Asistencia')?'Asistencia':levels.includes('Observación')?'Observación':'Sin nivel documentado';return `<div class="atlas-item"><div><strong>${escapeHtml(t)}</strong><div class="muted small" style="margin-top:7px">${n?escapeHtml(best):'Aún no realizada'} </div></div><div style="text-align:right"><b class="atlas-count">${n}</b><div class="small muted">${n===1?'intervención':'intervenciones'}</div></div>${n?`<div class="full small">${a.map(r=>`<a href="#" onclick="event.preventDefault();openCase('${r.id}')">${r.id} · ${nice(r.date)}</a>`).join(' &nbsp; · &nbsp; ')}</div>`:''}</div>`}).join('')}</div></div>`).join('')+`<div class="footer">El atlas es una lista orientativa, no exhaustiva. Añade otras técnicas al registro usando su denominación y podrás ampliar el catálogo en futuras versiones.</div>`;
}
function progreso(){let cats=[...new Set(records.map(x=>x.category))],levels=['Observación','Asistencia','Realización parcial supervisada','Realización principal supervisada','Sin especificar'];document.getElementById('main').innerHTML=header('Mi evolución','Aprender, practicar, dominar.','Resumen de la actividad y autonomía quirúrgica.')+`<div class="stats"><div class="stat"><strong>${records.length}</strong><label>Procedimientos</label></div><div class="stat"><strong>${new Set(records.map(x=>x.patient)).size}</strong><label>Pacientes</label></div><div class="stat"><strong>${records.filter(x=>x.level.includes('Realización')).length}</strong><label>Con ejecución documentada</label></div><div class="stat"><strong>${records.filter(x=>x.urgency).length}</strong><label>Urgencias</label></div></div><div class="section panel"><h2>Por especialidad</h2>${cats.map(x=>`<div class="progress-row"><strong>${escapeHtml(x)}</strong><div class="bar"><span style="width:${records.filter(r=>r.category===x).length/Math.max(1,records.length)*100}%"></span></div><span>${records.filter(r=>r.category===x).length} intervenciones</span></div>`).join('')}</div><div class="section panel"><h2>Mi participación</h2>${levels.map(x=>`<div class="progress-row"><strong>${escapeHtml(x)}</strong><div class="bar"><span style="width:${records.filter(r=>r.level===x).length/Math.max(1,records.length)*100}%"></span></div><span>${records.filter(r=>r.level===x).length}</span></div>`).join('')}</div><div class="footer">Los datos de participación son orientativos y deben reflejar fielmente los gestos realizados bajo supervisión.</div>`}
function dataView(){document.getElementById('main').innerHTML=header('Seguridad y portabilidad','Mis datos','Guarda copias, importa registros y conserva el cuaderno en el tiempo.')+`<div class="panel"><h2>Copias de seguridad</h2><p class="muted">Tus fichas se almacenan localmente en el navegador (localStorage). No se sincronizan entre móviles, ordenadores ni navegadores. Al borrar los datos del navegador puedes perderlas.</p><div class="actions"><button class="btn primary" onclick="exportJSON()">↓ Exportar copia JSON</button><button class="btn" onclick="document.getElementById('import').click()">↑ Importar copia JSON</button><button class="btn" onclick="exportCSV()">↓ Exportar tabla CSV</button><button class="btn" onclick="printBook()">⎙ Imprimir / Guardar como PDF</button></div></div><div class="panel"><h2>Privacidad y confidencialidad</h2><p class="muted">Emplea identificadores anónimos (P001, P002...). Nunca añadas nombres de propietarios, direcciones ni identificadores internos del hospital. Confirma la autorización antes de guardar imágenes o datos clínicos sensibles.</p></div><div class="panel"><h2>Restaurar ejemplo inicial</h2><p class="muted">Reemplaza el cuaderno actual por las ocho intervenciones iniciales. Esta acción es irreversible si no exportas antes una copia.</p><button class="btn danger" onclick="resetData()">Restaurar los datos iniciales</button></div>`}
function download(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJSON(){download('cuaderno-quirurgico-respaldo.json',new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),records},null,2)],{type:'application/json'}))}
function exportCSV(){let keys=['id','date','patient','animal','breed','weight','procedure','category','level',...fields.map(x=>x[0])],rows=[keys,...records.map(r=>keys.map(k=>r[k]??''))];download('registro-operatorio.csv',new Blob(['\ufeff'+rows.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}))}
document.getElementById('import').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text()),list=Array.isArray(obj)?obj:obj.records;if(!Array.isArray(list)||list.some(x=>!x.id||!x.procedure))throw Error('Formato inválido');if(confirm(`¿Importar ${list.length} intervenciones y reemplazar las actuales?`)){records=list;save();go('registro')}}catch(err){alert('No se pudo importar el archivo: '+err.message)}e.target.value=''});
function resetData(){if(confirm('¿Restaurar las ocho intervenciones iniciales y borrar las modificaciones locales?')){records=structuredClone(base);save();go('dashboard')}}
function printBook(){let w=window.open('','_blank');if(!w){alert('Permite las ventanas emergentes para imprimir.');return}w.document.write(`<html><head><meta charset="utf-8"><title>Cuaderno quirúrgico</title><style>body{font:12px Arial;color:#222;line-height:1.5;margin:35px}article{page-break-after:always}h1{font-size:26px}h2{font-size:19px;margin:22px 0 10px}h3{font-size:14px;color:#21766a}p{white-space:pre-wrap}small{color:#777}.atlas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:10px}.atlas-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;border:1px solid #30445a;padding:15px;border-radius:12px;background:#0d1a29}.atlas-item a{color:#78dbcb}.atlas-count{display:inline-block;border-radius:10px;background:#244c4b;color:#a0eee0;min-width:37px;text-align:center;padding:7px;font-size:20px}.case-bottom{align-items:flex-end}.case-bottom>.muted{max-width:55%}</style></head><body><h1>Cuaderno quirúrgico — UEM</h1><p>Registro formativo personal · ${records.length} intervenciones</p>${records.map(r=>`<article><h2>${escapeHtml(r.id)} · ${escapeHtml(r.procedure)}</h2><small>${nice(r.date)} · ${escapeHtml(r.animal)} · Paciente ${escapeHtml(r.patient)} · ${escapeHtml(r.level)}</small>${fields.map(([k,l])=>`<h3>${l}</h3><p>${escapeHtml(r[k]||'Pendiente de completar.')}</p>`).join('')}</article>`).join('')}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),400)}
function render(){({dashboard,registro,detail,edit:editView,atlas,progreso,datos:dataView}[page]||dashboard)()};document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));render();
</script></body></html>
